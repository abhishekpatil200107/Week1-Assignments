<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="index.html">Abhi.dev</a>
    <nav id="nav" class="nav" aria-label="Main"><a href="index.html">Home</a><a href="about.html">About</a><a href="projects.html">Projects</a><a href="contact.html" aria-current="page">Contact</a></nav>

    <button class="icon-btn nav-toggle" type="button" aria-expanded="false" aria-controls="nav">Menu</button>
  </div>
</header>
<main id="main">
<section class="section wrap contact" aria-labelledby="contact-h">
  <div>
    <h1 id="contact-h">Contact</h1>
    <p>Tell me about your project or role. I reply within two working days.</p>
    <form id="contact-form" novalidate>
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name" required>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>
      <button class="btn" type="submit">Send message</button>
      <p id="form-status" role="status"></p>
    </form>
  </div>
  <aside class="card" aria-label="Other ways to reach me">
    <h2 class="h3">Other ways to reach me</h2>
    <ul class="plain">
      <li><a href="mailto:Abhi@example.com">Abhi@example.com</a></li>
      <li><a href="https://github.com/your-username">GitHub</a></li>
      <li><a href="https://linkedin.com/in/your-username">LinkedIn</a></li>
    </ul>
  </aside>
</section>
</main>
